<!doctype html>
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Tabata</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #000;
        color: #fff;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        display: grid;
        place-items: center;
        text-align: center;
        padding: 24px;
      }
      .ring {
        width: 88px;
        height: 88px;
        border: 6px solid #fff;
        border-radius: 50%;
        margin: 0 auto 28px;
      }
      h1 {
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -0.03em;
        margin: 0 0 8px;
      }
      p {
        margin: 0;
        color: rgba(255, 255, 255, 0.45);
        font-size: 15px;
        line-height: 1.4;
        max-width: 22rem;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="ring" aria-hidden="true"></div>
      <h1>Tabata</h1>
      <p>
        Sett APP_URL til den kjørende nettappen og kjør
        <code>npx cap sync</code> før du bygger til butikkene.
      </p>
    </main>
  </body>
</html>
